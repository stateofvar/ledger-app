<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Ledger</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FBF9F6" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1C1B1A;
    --paper: #FBF9F6;
    --green: #2E5339;
    --red: #B8433A;
    --rule: #E4DFD6;
    --muted: #8A8478;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 100px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .month-nav button {
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink);
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 4px;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .month-nav button:disabled {
    color: var(--rule);
    border-color: var(--rule);
  }

  .month-label {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    letter-spacing: 0.02em;
    min-width: 130px;
    text-align: center;
  }

  .balance-section {
    padding: 18px 0 26px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 22px;
  }

  .balance-caption {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .balance-figure {
    font-family: 'Source Serif 4', serif;
    font-size: 52px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.01em;
  }

  .balance-figure.negative { color: var(--red); }

  .starting-line {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
  }

  form.entry {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 20px;
  }

  .entry-row {
    display: flex;
    gap: 10px;
  }

  input {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }

  input:focus {
    outline: none;
    border-color: var(--ink);
  }

  input[type="date"] { flex: 1.2; }
  input[type="number"] { flex: 1; }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 13px;
    border: none;
    border-radius: 4px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }

  button:active { opacity: 0.85; }

  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--rule);
    font-weight: 500;
    padding: 8px 12px;
    font-size: 13px;
  }

  .type-toggle {
    display: flex;
    gap: 8px;
  }

  .type-toggle button {
    flex: 1;
    background: #fff;
    border: 1px solid var(--rule);
    color: var(--muted);
    font-weight: 500;
    padding: 10px;
    font-size: 14px;
  }

  .type-toggle button.active.expense {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .type-toggle button.active.deposit {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .tx-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
    gap: 10px;
  }

  .tx-main {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .tx-note {
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tx-date {
    font-size: 12px;
    color: var(--muted);
  }

  .tx-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    flex-shrink: 0;
  }

  .tx-amount {
    font-family: 'Source Serif 4', serif;
    font-size: 17px;
    color: var(--red);
  }

  .tx-amount.deposit {
    color: var(--green);
  }

  .tx-balance {
    font-size: 11px;
    color: var(--muted);
  }

  .tx-actions {
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }

  .tx-actions button {
    background: none;
    color: var(--muted);
    font-size: 11px;
    padding: 2px 4px;
    font-weight: 500;
    text-decoration: underline;
  }

  .empty-state {
    color: var(--muted);
    font-size: 14px;
    padding: 20px 0;
    text-align: center;
  }

  .status {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-top: 14px;
    min-height: 18px;
  }

  .status.error { color: var(--red); }

  .edit-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28,27,26,0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }

  .edit-sheet {
    background: var(--paper);
    width: 100%;
    max-width: 480px;
    padding: 22px 20px 28px;
    border-radius: 14px 14px 0 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .edit-sheet h3 {
    font-family: 'Source Serif 4', serif;
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 600;
  }

  .edit-sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .edit-sheet-actions button { flex: 1; }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="month-nav">
      <button id="prevMonthBtn" aria-label="Previous month">&larr;</button>
      <div class="month-label" id="monthLabel">—</div>
      <button id="nextMonthBtn" aria-label="Next month">&rarr;</button>
    </div>
    <button class="secondary" id="refreshBtn">Refresh</button>
  </header>

  <div class="balance-section">
    <div class="balance-caption">Current balance</div>
    <div class="balance-figure" id="balanceFigure">—</div>
    <div class="starting-line" id="startingLine"></div>
  </div>

  <form class="entry" id="entryForm">
    <div class="type-toggle">
      <button type="button" class="active expense" id="typeExpenseBtn" data-type="expense">Expense</button>
      <button type="button" class="deposit" id="typeDepositBtn" data-type="deposit">Deposit</button>
    </div>
    <div class="entry-row">
      <input type="date" id="txDate" required />
      <input type="number" id="txAmount" placeholder="Amount" step="0.01" min="0" required />
    </div>
    <input type="text" id="txNote" placeholder="What was it for?" required />
    <button type="submit" id="submitBtn">Add expense</button>
  </form>

  <div class="tx-list-caption">This month</div>
  <div id="txList"><div class="empty-state">Loading…</div></div>

  <div class="status" id="status"></div>
</div>

<div class="edit-overlay hidden" id="editOverlay">
  <div class="edit-sheet">
    <h3>Edit transaction</h3>
    <div class="type-toggle">
      <button type="button" class="expense" id="editTypeExpenseBtn" data-type="expense">Expense</button>
      <button type="button" class="deposit" id="editTypeDepositBtn" data-type="deposit">Deposit</button>
    </div>
    <input type="date" id="editDate" />
    <input type="number" id="editAmount" step="0.01" min="0" />
    <input type="text" id="editNote" />
    <div class="edit-sheet-actions">
      <button class="secondary" id="editCancel">Cancel</button>
      <button id="editSave">Save changes</button>
    </div>
  </div>
</div>

<script>
const FN_URL = '/.netlify/functions/sheet';

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function currentMonthKey() {
  return todayStr().slice(0,7);
}

function shiftMonthKey(monthKey, delta) {
  const [y, m] = monthKey.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  const yy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${yy}-${mm}`;
}

function formatMoney(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toFixed(2);
}

function formatMonthLabel(monthKey) {
  const [y,m] = monthKey.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
}

function formatDate(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

const els = {
  monthLabel: document.getElementById('monthLabel'),
  balanceFigure: document.getElementById('balanceFigure'),
  startingLine: document.getElementById('startingLine'),
  entryForm: document.getElementById('entryForm'),
  typeExpenseBtn: document.getElementById('typeExpenseBtn'),
  typeDepositBtn: document.getElementById('typeDepositBtn'),
  txDate: document.getElementById('txDate'),
  txAmount: document.getElementById('txAmount'),
  txNote: document.getElementById('txNote'),
  submitBtn: document.getElementById('submitBtn'),
  txList: document.getElementById('txList'),
  status: document.getElementById('status'),
  refreshBtn: document.getElementById('refreshBtn'),
  prevMonthBtn: document.getElementById('prevMonthBtn'),
  nextMonthBtn: document.getElementById('nextMonthBtn'),
  editOverlay: document.getElementById('editOverlay'),
  editDate: document.getElementById('editDate'),
  editAmount: document.getElementById('editAmount'),
  editNote: document.getElementById('editNote'),
  editCancel: document.getElementById('editCancel'),
  editSave: document.getElementById('editSave'),
  editTypeExpenseBtn: document.getElementById('editTypeExpenseBtn'),
  editTypeDepositBtn: document.getElementById('editTypeDepositBtn'),
};

let currentData = null;
let editingRow = null;
let entryType = 'expense';
let editType = 'expense';
// Start the app viewing the current real month by default.
// Use the back arrow to navigate to earlier months like August 2026.
let viewedMonth = currentMonthKey();

function setEntryType(type) {
  entryType = type;
  els.typeExpenseBtn.classList.toggle('active', type === 'expense');
  els.typeDepositBtn.classList.toggle('active', type === 'deposit');
  els.submitBtn.textContent = type === 'deposit' ? 'Add deposit' : 'Add expense';
  els.txAmount.placeholder = type === 'deposit' ? 'Amount deposited' : 'Amount spent';
}

els.typeExpenseBtn.addEventListener('click', () => setEntryType('expense'));
els.typeDepositBtn.addEventListener('click', () => setEntryType('deposit'));

function setEditType(type) {
  editType = type;
  els.editTypeExpenseBtn.classList.toggle('active', type === 'expense');
  els.editTypeDepositBtn.classList.toggle('active', type === 'deposit');
}

els.editTypeExpenseBtn.addEventListener('click', () => setEditType('expense'));
els.editTypeDepositBtn.addEventListener('click', () => setEditType('deposit'));

function setStatus(msg, isError) {
  els.status.textContent = msg || '';
  els.status.className = 'status' + (isError ? ' error' : '');
}

async function loadMonth(monthKey) {
  setStatus('Loading…');
  try {
    const res = await fetch(`${FN_URL}?action=month&month=${monthKey}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load');
    currentData = data;
    render();
    setStatus('');
  } catch (err) {
    setStatus(err.message, true);
    els.txList.innerHTML = '<div class="empty-state">Could not load data.</div>';
  }
}

function render() {
  const d = currentData;
  els.monthLabel.textContent = formatMonthLabel(d.monthKey);
  const bal = d.currentBalance != null ? d.currentBalance : d.startingBalance;
  els.balanceFigure.textContent = formatMoney(bal);
  els.balanceFigure.className = 'balance-figure' + (bal < 0 ? ' negative' : '');
  els.startingLine.textContent = d.startingBalance != null
    ? `Started the month at ${formatMoney(d.startingBalance)}`
    : 'No starting balance set for this month yet.';

  els.nextMonthBtn.disabled = viewedMonth >= currentMonthKey();

  if (!d.transactions || d.transactions.length === 0) {
    els.txList.innerHTML = '<div class="empty-state">No expenses logged yet this month.</div>';
    return;
  }

  const rowsHtml = d.transactions.slice().reverse().map(tx => {
    const isDeposit = tx.type === 'deposit';
    const sign = isDeposit ? '+' : '-';
    return `
    <div class="tx-row" data-row="${tx.rowNumber}">
      <div class="tx-main">
        <div class="tx-note">${escapeHtml(tx.note)}</div>
        <div class="tx-date">${formatDate(tx.date)}</div>
      </div>
      <div class="tx-right">
        <div class="tx-amount${isDeposit ? ' deposit' : ''}">${sign}${formatMoney(Math.abs(tx.amount)).replace('-','')}</div>
        <div class="tx-balance">bal ${formatMoney(tx.balance)}</div>
        <div class="tx-actions">
          <button class="edit-btn" data-row="${tx.rowNumber}">Edit</button>
          <button class="delete-btn" data-row="${tx.rowNumber}">Delete</button>
        </div>
      </div>
    </div>
  `;
  }).join('');
  els.txList.innerHTML = rowsHtml;

  els.txList.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openEdit(parseInt(btn.dataset.row)));
  });
  els.txList.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteTx(parseInt(btn.dataset.row)));
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function findTx(rowNumber) {
  return currentData.transactions.find(t => t.rowNumber === rowNumber);
}

function openEdit(rowNumber) {
  const tx = findTx(rowNumber);
  if (!tx) return;
  editingRow = rowNumber;
  els.editDate.value = tx.date;
  els.editAmount.value = tx.amount;
  els.editNote.value = tx.note;
  setEditType(tx.type || 'expense');
  els.editOverlay.classList.remove('hidden');
}

els.editCancel.addEventListener('click', () => {
  els.editOverlay.classList.add('hidden');
  editingRow = null;
});

els.editSave.addEventListener('click', async () => {
  const date = els.editDate.value;
  const amount = parseFloat(els.editAmount.value);
  const note = els.editNote.value.trim();
  if (!date || isNaN(amount) || !note) { setStatus('Fill in all fields.', true); return; }

  els.editSave.textContent = 'Saving…';
  try {
    const res = await fetch(`${FN_URL}?action=transaction`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rowNumber: editingRow, date, amount, note, type: editType }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save');
    els.editOverlay.classList.add('hidden');
    editingRow = null;
    await loadMonth(viewedMonth);
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    els.editSave.textContent = 'Save changes';
  }
});

async function deleteTx(rowNumber) {
  if (!confirm('Delete this expense?')) return;
  setStatus('Deleting…');
  try {
    const res = await fetch(`${FN_URL}?action=transaction&rowNumber=${rowNumber}&month=${viewedMonth}`, {
      method: 'DELETE',
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to delete');
    await loadMonth(viewedMonth);
  } catch (err) {
    setStatus(err.message, true);
  }
}

els.entryForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const date = els.txDate.value;
  const amount = parseFloat(els.txAmount.value);
  const note = els.txNote.value.trim();
  if (!date || isNaN(amount) || amount <= 0 || !note) {
    setStatus('Fill in all fields with a valid amount.', true);
    return;
  }

  els.submitBtn.disabled = true;
  els.submitBtn.textContent = 'Adding…';
  try {
    const res = await fetch(`${FN_URL}?action=transaction`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, amount, note, type: entryType }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to add');
    els.txAmount.value = '';
    els.txNote.value = '';
    setEntryType('expense');
    await loadMonth(viewedMonth);
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    els.submitBtn.disabled = false;
    els.submitBtn.textContent = 'Add expense';
  }
});

els.refreshBtn.addEventListener('click', () => loadMonth(viewedMonth));

els.prevMonthBtn.addEventListener('click', () => {
  viewedMonth = shiftMonthKey(viewedMonth, -1);
  updateDateFieldDefault();
  loadMonth(viewedMonth);
});

els.nextMonthBtn.addEventListener('click', () => {
  if (viewedMonth >= currentMonthKey()) return;
  viewedMonth = shiftMonthKey(viewedMonth, 1);
  updateDateFieldDefault();
  loadMonth(viewedMonth);
});

function updateDateFieldDefault() {
  if (viewedMonth === currentMonthKey()) {
    els.txDate.value = todayStr();
  } else {
    els.txDate.value = `${viewedMonth}-01`;
  }
}

// init
updateDateFieldDefault();
loadMonth(viewedMonth);
</script>
</body>
</html>
